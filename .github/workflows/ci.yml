name: CI/CD Pipeline (GitHub Free-Tier Optimized)

on:
  push:
    branches: [main, master, staging]
  pull_request:
    branches: [main, master, staging]

# Terminate superseded runs to conserve the 2,000 monthly Linux minutes quota
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  CARGO_TERM_COLOR: always
  RUSTFLAGS: "-D warnings"

jobs:
  # =========================================================================
  # 1. Fast Linting & Formatting Check (All PRs)
  # =========================================================================
  lint-and-typecheck:
    name: Lint & Typecheck
    runs-on: ubuntu-latest # Strictly ubuntu-latest (Free Tier Linux: 1x multiplier)
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain (Pinned to 1.92.0 for sqlx-postgres compatibility)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0
          components: rustfmt, clippy

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend -> target"

      - name: Run Cargo Format Check
        run: cargo fmt --all -- --check

      - name: Run Cargo Clippy
        run: cargo clippy --workspace --all-targets -- -D warnings

  # =========================================================================
  # 2. Rust Backend Test Suite (Includes GiST Concurrency Stress Tests)
  # =========================================================================
  test-backend:
    name: Backend Test Suite & Concurrency
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres_dev_secret_change_in_prod
          POSTGRES_DB: tenants_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d tenants_db"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 3s
          --health-timeout 3s
          --health-retries 10
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup Rust Toolchain (Pinned to 1.92.0 for sqlx-postgres compatibility)
        uses: dtolnay/rust-toolchain@master
        with:
          toolchain: 1.92.0

      - name: Rust Cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "backend -> target"

      - name: Run Database Migrations
        env:
          DATABASE_URL: postgres://postgres:postgres_dev_secret_change_in_prod@localhost:5432/tenants_db
        run: |
          cargo install sqlx-cli --no-default-features --features native-tls,postgres --locked
          sqlx migrate run --source backend/migrations

      - name: Run Rust Unit & Integration Tests
        env:
          DATABASE_URL: postgres://postgres:postgres_dev_secret_change_in_prod@localhost:5432/tenants_db
          REDIS_URL: redis://localhost:6379
          JWT_SECRET: super_secure_development_jwt_secret_must_be_changed_in_prod_12345
        run: cargo test --workspace -- --nocapture

  # =========================================================================
  # 3. Web & Mobile Frontend Unit & Component Tests
  # =========================================================================
  test-frontend:
    name: Frontend Test Suite
    runs-on: ubuntu-latest
    needs: [lint-and-typecheck]
    steps:
      - name: Checkout Code
        uses: actions/checkout@v7

      - name: Setup pnpm
        uses: pnpm/action-setup@v6

      - name: Setup Node.js (with pnpm store caching)
        uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install Monorepo Dependencies
        run: pnpm install --frozen-lockfile=false

      - name: Run Web Component Tests (Vitest)
        run: pnpm --filter @tenants/web test
